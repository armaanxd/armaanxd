name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff4d8d&color_dots=#1b1530,#3b2a5c,#6a4bb8,#a07cff,#ff78af&color_dot_border=#00000000
            dist/snake-light.svg?color_snake=#ff4d8d&color_dots=#efe9f8,#d9c9ff,#b39aff,#8b6cff,#ff4d8d&color_dot_border=#00000000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f97316&color_dots=#22111a,#5b1e3c,#9a3412,#ea580c,#fdba74&color_dot_border=#00000000
            dist/snake-light.svg?color_snake=#ea580c&color_dots=#fff1e6,#fed7aa,#fdba74,#fb923c,#c2410c&color_dot_border=#00000000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

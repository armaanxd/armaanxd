name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#22d3ee&color_dots=#0f172a,#0c3a5e,#0369a1,#0ea5e9,#7dd3fc&color_dot_border=#00000000
            dist/snake-light.svg?color_snake=#0284c7&color_dots=#e6eef8,#bae6fd,#7dd3fc,#38bdf8,#0369a1&color_dot_border=#00000000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

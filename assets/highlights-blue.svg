<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Now building QuestFit, focused on TypeScript and Three.js, next up local AI tools">
  <style>
    .card{animation:in .8s ease-out backwards}
    .c2{animation-delay:.4s}.c3{animation-delay:.8s}
    .l{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#7DD3FC}
    .t{font:700 22px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#F0F9FF}
    .s{font:400 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#94A3B8}
    .dot{fill:#22D3EE;animation:pulse 1.6s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(14px)}}
    @keyframes pulse{50%{opacity:.2}}
  </style>
  <rect width="1000" height="150" rx="18" fill="#05070D"/>
  <g class="card"><rect x="20" y="20" width="306" height="110" rx="12" fill="#0A1020" stroke="#38BDF8" stroke-opacity=".35"/>
    <circle cx="44" cy="46" r="5" class="dot"/><text x="58" y="51" class="l">NOW BUILDING</text>
    <text x="40" y="86" class="t">QuestFit</text><text x="40" y="110" class="s">Fitness RPG for Android</text></g>
  <g class="card c2"><rect x="347" y="20" width="306" height="110" rx="12" fill="#0A1020" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="367" y="51" class="l">CURRENT FOCUS</text>
    <text x="367" y="86" class="t">TypeScript · Three.js</text><text x="367" y="110" class="s">Interfaces that feel alive</text></g>
  <g class="card c3"><rect x="674" y="20" width="306" height="110" rx="12" fill="#0A1020" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="694" y="51" class="l">IN THE QUEUE</text>
    <text x="694" y="86" class="t">Local AI tools</text><text x="694" y="110" class="s">Private, on-device, no cloud</text></g>
</svg>

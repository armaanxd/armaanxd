<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Languages across my repos: Python 40%, JavaScript 40%, TypeScript 20%">
  <!-- shortcut: percentages hand-counted from repo languages on 2026-11-26, update when repos change -->
  <style>
    .n{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E0F2FE}
    .p{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7DD3FC;animation:fade .5s 1.2s backwards}
    .b{transform-box:fill-box;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) backwards}
    .b2{animation-delay:.2s}.b3{animation-delay:.4s}
    .h{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#7DD3FC;opacity:.75}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes fade{from{opacity:0}}
  </style>
  <rect width="1000" height="170" rx="18" fill="#05070D"/>
  <text x="40" y="34" class="h">LANGUAGES ACROSS MY REPOS</text>
  <text x="40" y="70" class="n">Python</text><rect x="180" y="58" width="700" height="14" rx="7" fill="#0A1020"/>
  <rect x="180" y="58" width="280" height="14" rx="7" fill="#38BDF8" class="b"/><text x="900" y="70" class="p">40%</text>
  <text x="40" y="104" class="n">JavaScript</text><rect x="180" y="92" width="700" height="14" rx="7" fill="#0A1020"/>
  <rect x="180" y="92" width="280" height="14" rx="7" fill="#22D3EE" class="b b2"/><text x="900" y="104" class="p">40%</text>
  <text x="40" y="138" class="n">TypeScript</text><rect x="180" y="126" width="700" height="14" rx="7" fill="#0A1020"/>
  <rect x="180" y="126" width="140" height="14" rx="7" fill="#818CF8" class="b b3"/><text x="900" y="138" class="p">20%</text>
</svg>
